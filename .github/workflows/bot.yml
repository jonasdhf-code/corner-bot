name: Corner Signal Bot

on:
  schedule:
    - cron: "*/10 * * * *"   # executa a cada 10 minutos, 24/7
  workflow_dispatch:          # permite rodar manualmente pelo celular

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Restaura cache de sinais já enviados (evita duplicatas)
      - name: Restaurar cache de sinais
        uses: actions/cache@v4
        with:
          path: sent_signals.json
          key: signals-cache-${{ github.run_id }}
          restore-keys: |
            signals-cache-

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      # Salva cache atualizado para a próxima execução
      - name: Salvar cache de sinais
        if: always()
        uses: actions/cache@v4
        with:
          path: sent_signals.json
          key: signals-cache-${{ github.run_id }}
